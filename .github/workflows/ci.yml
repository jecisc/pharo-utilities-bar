name: CI

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    paths-ignore:
      - 'resources/'
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - 'resources/'
      - '**.md'
      - LICENSE
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk: [ Pharo64-12, Pharo64-13, Pharo64-14, Pharo64-15 ]
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v6
      - uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - run: smalltalkci -s ${{ matrix.smalltalk }}
        shell: bash
        timeout-minutes: 15
